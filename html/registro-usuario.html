<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PetCard – Registro</title>

<link rel="stylesheet" href="../css/shared.css"/>
<link rel="stylesheet" href="../css/registro-usuario.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>

<style>
.spinner{width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top:3px solid white;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{100%{transform:rotate(360deg);}}
.btn-loading{display:flex;align-items:center;justify-content:center;gap:8px;pointer-events:none;}
.error{color:red;font-size:0.875rem;margin-top:0.25rem;display:none;}
</style>
</head>
<body>

<nav class="navbar">
<a href="./inicio.html" class="nav-logo">PETCARD</a>
</nav>

<main class="auth-container">
<div class="auth-left">
<h1>Bienvenido a PetCard</h1>
<p>Registra tu cuenta y comienza a cuidar a tus mascotas de la mejor manera.</p>
<img src="https://images.unsplash.com/photo-1544568100-847a948585b9?w=500" alt="Mascota feliz" class="hero-image">
</div>
<div class="auth-right">
<div class="auth-card card">

<h2 class="auth-title">Crear Cuenta</h2>

<div class="form-group">
<label>Nombre</label>
<div class="input-group">
<i class="fas fa-user"></i>
<input type="text" class="form-control" id="nombre">
</div>
<div class="error" id="error-nombre"></div>
</div>

<div class="form-group">
<label>Apellido</label>
<div class="input-group">
<i class="fas fa-user"></i>
<input type="text" class="form-control" id="apellido">
</div>
<div class="error" id="error-apellido"></div>
</div>

<div class="form-group">
<label>Correo</label>
<div class="input-group">
<i class="fas fa-envelope"></i>
<input type="email" class="form-control" id="email">
</div>
<div class="error" id="error-email"></div>
</div>

<div class="form-group">
<label>Teléfono</label>
<div class="input-group">
<i class="fas fa-phone"></i>
<input type="tel" class="form-control" id="telefono">
</div>
<div class="error" id="error-telefono"></div>
</div>

<div class="form-group">
<label>Contraseña</label>
<div class="input-group">
<i class="fas fa-lock"></i>
<input type="password" class="form-control" id="password">
</div>
<div class="error" id="error-password"></div>
</div>

<div class="form-group">
<label>Confirmar contraseña</label>
<div class="input-group">
<i class="fas fa-lock"></i>
<input type="password" class="form-control" id="confirm">
</div>
<div class="error" id="error-confirm"></div>
</div>

<div class="form-group checkbox-group">
<label class="checkbox-label">
<input type="checkbox" id="terminos">
Acepto términos y condiciones
</label>
<div class="error" id="error-terminos"></div>
</div>

<button class="btn btn-primary btn-full" id="crear">Crear Cuenta</button>

<p class="auth-footer">
¿Ya tienes cuenta? <a href="./login-usuario.html">Iniciar sesión</a>
</p>

</div>
</main>



</body>
</html>
