<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/shared.css"/>
  <link rel="stylesheet" href="../css/agendar-cita.css"/>
</head>
<body>
    <div class="container mt-5">
  <h2>Agendar Cita</h2>
  <form>
<!-- Servicio -->
    <div class="mb-3"> <label for="mascota" class="form-label">Tipo de Servicio</label> 
      <select class="form-select" id="mascota" required> <option selected disabled>Selecciona tu servicio</option> 
      <option value="1">Consulta General</option> 
      <option value="2">Vacunación</option> 
      <option value="3">Cirugía</option> 
      <option value="4">Emergencia</option> 
      <option value="5">Análisis Clínicos</option> 
      <option value="5">Radiografias</option> 
      <option value="5">Desparasitacion</option> 
      <option value="5">Odontologia</option> 
    </select> 
  </div>
   <!-- documento -->
     <div class="mb-3">
      <label for="telefono" class="form-label">Documento</label>
      <input type="tel" class="form-control" id="telefono" required>
    </div>
    <!-- Fecha -->
    <div class="mb-3">
      <label for="fecha" class="form-label">Fecha</label>
      <input type="date" class="form-control" id="fecha" required>
    </div>

    <!-- Hora -->
    <div class="mb-3">
      <label for="hora" class="form-label">Hora</label>
      <input type="time" class="form-control" id="hora" required>
    </div>

    <!-- Datos de contacto -->
    <div class="mb-3">
      <label for="nombre" class="form-label">Nombre</label>
      <input type="text" class="form-control" id="nombre" required>
    </div>
    <div class="mb-3">
      <label for="telefono" class="form-label">Teléfono</label>
      <input type="tel" class="form-control" id="telefono" required>
    </div>
    <div class="mb-3">
      <label for="correo" class="form-label">Correo</label>
      <input type="email" class="form-control" id="correo" required>
    </div>

    <!-- Botón -->
    <button type="submit" class="btn btn-primary">Confirmar Cita</button>
  </form>
</div>
<script src="../js/script.js"></script>
</body>
</html>
