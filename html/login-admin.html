<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PetCard – Inicio de Sesión Administrador</title>

  <link rel="stylesheet" href="../css/shared.css"/>
  <link rel="stylesheet" href="../css/login-admin.css"/>

  <!-- 🔥 estilos SOLO para animación -->
  <style>
    .spinner{
      width:18px;
      height:18px;
      border:3px solid rgba(255,255,255,.4);
      border-top:3px solid white;
      border-radius:50%;
      animation:spin .8s linear infinite;
      display:inline-block;
    }

    @keyframes spin{
      100%{transform:rotate(360deg);}
    }

    .btn-loading{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      pointer-events:none;
      opacity:.85;
    }
  </style>
</head>

<body>

  <!-- ===== NAVBAR ORIGINAL ===== -->
  <nav class="navbar">
    <a href="#" class="nav-logo">
      <!-- TU SVG ORIGINAL -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M12 2L4 6v6c0 5.25 3.5 10.15 8 11.35C17.5 22.15 21 17.25 21 12V6l-9-4z"
        fill="currentColor" opacity=".15"/>
      </svg>
      PETCARD
    </a>
  </nav>

  <!-- ===== LOGIN ===== -->
  <main class="auth-wrapper">
    <div class="auth-card card">

      <h1 class="auth-title">Iniciar Sesión</h1>
      <p class="auth-sub">
        Ingresa a tu cuenta de PetCard para gestionar el cuidado de tus mascotas
      </p>

      <div class="form-group">
        <label>Correo Electrónico</label>
        <input type="email" class="form-control"
        placeholder="tu@ejemplo.com" id="input-email"/>
      </div>

      <div class="form-group">
        <label>Contraseña</label>

        <div class="input-wrapper">
          <input type="password" class="form-control"
          placeholder="Tu contraseña" id="input-password"/>

          <button type="button" class="input-icon" id="toggle-pass">
            👁
          </button>
        </div>
      </div>

      <div class="remember-row">
        <label class="checkbox-group">
          <input type="checkbox" id="chk-recordar"/> Recordarme
        </label>
        <a href="#" class="link">¿Olvidaste tu contraseña?</a>
      </div>

      <!-- 🔥 MISMO BOTÓN -->
      <button class="btn btn-primary btn-full btn-lg"
        id="btn-login" style="margin-top:1rem;">
        Iniciar Sesión
      </button>

      <p class="auth-footer-text">
        ¿No tienes una cuenta?
        <a href="registro-admin.html" class="link">Regístrate aquí</a>
      </p>

      <div class="divider-text">O continúa con</div>

      <div class="social-row">
        <button class="social-btn" id="btn-google">Google</button>
        <button class="social-btn" id="btn-facebook">Facebook</button>
      </div>

    </div>
  </main>

  <!-- ===== FOOTER ORIGINAL ===== -->
  <footer class="footer-simple">
    <p style="color:#fff;">© 2024 PetCard. Todos los derechos reservados.</p>
  </footer>

  <!-- ========================= -->
  <!-- JAVASCRIPT PROFESIONAL -->
  <!-- ========================= -->
  <script>
    (function() {
      'use strict';

      const ADMIN_KEY = 'petcard_admin_sesion';

      function init() {
        const btnLogin = document.getElementById('btn-login');
        const togglePass = document.getElementById('toggle-pass');
        const inputEmail = document.getElementById('input-email');
        const inputPassword = document.getElementById('input-password');

        // Toggle password visibility
        if (togglePass) {
          togglePass.addEventListener('click', () => {
            const type = inputPassword.type === 'password' ? 'text' : 'password';
            inputPassword.type = type;
            togglePass.textContent = type === 'password' ? '👁' : '👁‍🗨️';
          });
        }

        // Handle login
        if (btnLogin) {
          btnLogin.addEventListener('click', handleLogin);
          document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleLogin();
          });
        }
      }

      function handleLogin() {
        const btnLogin = document.getElementById('btn-login');
        const email = document.getElementById('input-email').value.trim();
        const password = document.getElementById('input-password').value;

        // Validar campos
        if (!email) {
          alert('⚠️ Por favor ingresa tu correo electrónico');
          return;
        }

        if (!password) {
          alert('⚠️ Por favor ingresa tu contraseña');
          return;
        }

        // Credenciales por defecto de admin
        const ADMIN_EMAIL = 'admin@petcard.com';
        const ADMIN_PASSWORD = '1234';

        // Validar credenciales
        if (email !== ADMIN_EMAIL || password !== ADMIN_PASSWORD) {
          alert('❌ Credenciales incorrectas. Email: admin@petcard.com, Contraseña: 1234');
          return;
        }

        // Crear objeto de sesión admin
        const adminData = {
          id: 'admin_001',
          nombre: 'Administrador',
          apellido: 'PetCard',
          email: ADMIN_EMAIL,
          rol: 'admin',
          timestamp: new Date().toISOString()
        };

        // Mostrar loading
        btnLogin.disabled = true;
        btnLogin.innerHTML = '<span class="spinner"></span> Iniciando sesión...';

        // Simular delay
        setTimeout(() => {
          try {
            // Guardar sesión
            localStorage.setItem(ADMIN_KEY, JSON.stringify(adminData));
            
            // Redirigir
            window.location.href = './admin-inicio.html';
          } catch (error) {
            console.error('Error al guardar sesión:', error);
            alert('❌ Error al iniciar sesión');
            btnLogin.disabled = false;
            btnLogin.innerHTML = 'Iniciar Sesión';
          }
        }, 1200);
      }

      // Inicializar
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>

</body>
</html>
